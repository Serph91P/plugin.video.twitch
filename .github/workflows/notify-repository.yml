name: Validate and Notify Repository

on:
  workflow_run:
    workflows: ["Add-on Validations"]
    types: [completed]

permissions:
  actions: read

jobs:
  validated-publication:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'develop'
    steps:
      - name: Validate run and build payload
        id: validate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ github.token }}
          script: |
            const run = github.context.payload.workflow_run;

            const shaPattern = /^[0-9a-f]{40}$/;
            if (!shaPattern.test(run.head_sha)) {
              core.setFailed('Invalid head SHA format: ' + run.head_sha);
              return;
            }

            if (!Number.isInteger(run.id) || run.id <= 0) {
              core.setFailed('Invalid run ID: ' + run.id);
              return;
            }

            if (run.name !== 'Add-on Validations') {
              core.setFailed('Unexpected workflow name: ' + run.name);
              return;
            }

            if (run.event !== 'push') {
              core.setFailed('Unexpected event: ' + run.event);
              return;
            }

            if (run.conclusion !== 'success') {
              core.setFailed('Unexpected conclusion: ' + run.conclusion);
              return;
            }

            if (run.head_branch !== 'develop') {
              core.setFailed('Unexpected branch: ' + run.head_branch);
              return;
            }

            const { data: firstPage } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: github.context.repo.owner,
              repo: github.context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });

            let allArtifacts = firstPage.artifacts || [];
            const totalCount = firstPage.total_count || 0;

            if (allArtifacts.length < totalCount) {
              let page = 2;
              while (allArtifacts.length < totalCount && page <= 10) {
                const { data: nextPage } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: github.context.repo.owner,
                  repo: github.context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                  page,
                });
                allArtifacts = allArtifacts.concat(nextPage.artifacts || []);
                page++;
              }
            }

            if (allArtifacts.length < totalCount) {
              core.setFailed('Incomplete pagination: fetched ' + allArtifacts.length + ' of ' + totalCount + ' artifacts');
              return;
            }

            const addonPackages = allArtifacts.filter(a => a.name === 'addon-package');
            const validAddonPackages = addonPackages.filter(a => !a.expired);
            if (addonPackages.length !== 1) {
              core.setFailed('Expected exactly 1 addon-package artifact, found ' + addonPackages.length);
              return;
            }
            if (validAddonPackages.length !== 1) {
              core.setFailed('addon-package artifact is expired');
              return;
            }

            const validationEvidences = allArtifacts.filter(a => a.name === 'validation-evidence');
            const validValidationEvidences = validationEvidences.filter(a => !a.expired);
            if (validationEvidences.length !== 1) {
              core.setFailed('Expected exactly 1 validation-evidence artifact, found ' + validationEvidences.length);
              return;
            }
            if (validValidationEvidences.length !== 1) {
              core.setFailed('validation-evidence artifact is expired');
              return;
            }

            const payload = {
              source_repo: github.context.repo.owner + '/' + github.context.repo.repo,
              candidate_sha: run.head_sha,
              validation_run_id: run.id,
              validation_head_sha: run.head_sha,
              validation_workflow: run.name,
              expected_branch: run.head_branch,
            };

            core.setOutput('payload', JSON.stringify(payload));
            core.info('Payload ready for dispatch to Serph91P/repository.serph91p');

      - name: Dispatch publication notification
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: Serph91P/repository.serph91p
          event-type: validated-addon-publication
          client-payload: ${{ steps.validate.outputs.payload }}
